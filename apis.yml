aid: sycamore
name: Sycamore
description: >-
  Sycamore (Sycamore Labs, Inc.) is a Palo Alto, California company building a
  "trusted agent operating system for the enterprise" — a platform for large
  organizations to build, deploy, and orchestrate autonomous AI agents across
  their existing systems with enterprise-grade security, human oversight, and
  organizational intelligence that compounds over time. Its stated pillars are a
  progressive trust system where agents earn autonomy through demonstrated
  reliability, adaptive system generation from natural language, continuous
  learning from outcomes, and collective multi-agent coordination. The company
  emerged from stealth in March 2026 with a $65M seed round led by Coatue and
  Lightspeed. As of this profile Sycamore is pre-product with no public developer
  API, SDK, or documentation surface; this repo captures its public company
  identity, security posture, and machine-readable llms.txt.
